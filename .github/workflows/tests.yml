name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse-bills:
    # The bill corpus is gitignored, so the corpus-dependent cases skip here. Everything
    # guarding publication — atomic writes, rollback, the recovery-backup rules and the
    # cross-process lock — runs on temp files or the committed data/ artifacts, so a
    # regression in those cannot reach main unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: parse_bills guard tests
        run: python analysis/test_parse_bills.py
      - name: historical rate engine guard tests
        run: python analysis/test_rates_history.py
      - name: bill decomposition guard tests
        run: python analysis/test_bill_decomposition.py
      - name: irreducible-bill guard tests
        run: python analysis/test_irreducible_bill.py
      - name: CCA rate extraction guard tests
        run: python analysis/test_cca_rate_extraction.py
      - name: CCA bundled counterfactual guard tests
        run: python analysis/test_cca_bundled_counterfactual.py

  tou-audit:
    # The TOU audit reconciles billed kWh against the raw interval export, which is
    # gitignored. Every test case is synthetic, so the edge handling that carries the
    # audit — DST-length days, period boundaries, the structural changeover date and
    # holiday assignment — is guarded here in full.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: tou_audit guard tests
        run: python analysis/test_tou_audit.py

  rates:
    # The canonical TOU assignment, including the eight bill-confirmed tariff
    # holidays. These cases are pure logic plus a grep of the analysis package for
    # reintroduced private copies of the window rule, so they need no private data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: rates guard tests
        run: python analysis/test_rates.py
      - name: report/artifact consistency
        run: python analysis/test_report_consistency.py
      - name: TOU-spread escalation guards and artifact regeneration
        run: python analysis/test_tou_spread.py
      - name: NEM 2.0 grandfathering value + battery-marginal reconciliation guard tests
        run: python analysis/test_nem3_grandfathering.py
      - name: DSGS VPP backtest guard tests
        run: python analysis/test_dsgs_vpp_backtest.py
      - name: battery sizing curve guard tests
        run: python analysis/test_battery_sizing_curve.py
      - name: battery dispatch policy guard tests
        run: python analysis/test_battery_dispatch_policies.py
      - name: perfect-foresight dispatch guard tests
        run: python analysis/test_perfect_foresight_dispatch.py
      - name: TOU structure stress-test guard tests
        run: python analysis/test_tou_structure_stress.py
      - name: analysis scripts runnable or explicitly retired
        run: python analysis/test_scripts_runnable.py
      - name: extra_results.json escalation-block generator guard tests
        run: python analysis/test_extra_results.py
      - name: package_results upstream-artifact resolution guard tests
        run: python analysis/test_package_results.py
      - name: carbon raw-cache and fail-closed branches
        run: python analysis/test_carbon_fullyear.py
      - name: carbon-vs-cost dispatch tradeoff guard tests
        run: python analysis/test_carbon_dispatch_tradeoff.py
      - name: household intake fail-closed behavior
        run: python analysis/test_household.py
      - name: transactional set publication
        run: python analysis/test_publish.py
      - name: service headroom NEC arithmetic and DST guards
        run: python analysis/test_service_headroom.py
      # NOT a real-value scan. private/household.yaml is gitignored, so no
      # runner has a household answer to look for, and putting one here would
      # be the leak the gate exists to prevent. What runs: the resolver
      # contract, the tier vocabulary, the synthetic positive controls, and
      # both halves of the key/path rule for the fields no literal scan can
      # cover. The two cases that need real values SKIP, and the suite prints
      # a banner naming them — read it before treating this check as coverage.
      # The real-value scan runs in the local pre-commit hook (CLAUDE.md §4).
      - name: intake privacy tiers — contract and synthetic controls (real-value scan SKIPS, no private data on a runner)
        run: python analysis/test_privacy_tiers.py
      # issue #102: these seven were real, already-passing local suites in
      # check_coverage.sh's SUITE list with no CI step of their own -- a
      # regression in any of them could reach main with every check green.
      # None need the private archive to run for real (each gates its own
      # optional archive-dependent cases behind SkipCase).
      - name: LLM egress-preflight guard tests
        run: python analysis/test_egress_preflight.py
      - name: report-generation guard tests
        run: python analysis/test_generate_report.py
      - name: LLM provider adapter guard tests (no real network calls)
        run: python analysis/test_llm_providers.py
      - name: report prose-lint guard tests
        run: python analysis/test_prose_lint.py
      - name: report prose-block extractor guard tests
        run: python analysis/test_prose_blocks.py
      - name: report version-stamp guard tests
        run: python analysis/test_stamp_report_version.py
      - name: suite-runner guard tests (one bad case may not end a run)
        run: python analysis/test_suite_runner.py
      - name: report TODO-block classification guard tests
        run: python analysis/test_report_blocks.py
      - name: report-token resolution guard tests
        run: python analysis/test_report_tokens.py
      - name: dry-run sandbox guard tests
        run: python analysis/test_dry_run.py
      - name: stage-private-data.sh guard tests
        run: python analysis/test_stage_private_data.py
      # issue #186: the census of code that copies raw private files, and the
      # proof that private_egress.py and stage-private-data.sh return identical
      # verdicts on a shared table of destinations. Needs no private archive --
      # the agreement table stages a SYNTHETIC source (empty files with the
      # archive's names) into throwaway `git worktree add` worktrees of the
      # checkout, so an unregistered mover fails HERE rather than being noticed
      # after it has written somewhere nobody looks.
      # The suite FAILS rather than skips when git cannot give it a worktree
      # register or a file list: main() counted a SkipCase and exited 0, so a
      # runner where `git worktree add` or `git ls-files` refuses turned the
      # census and the whole 17-row agreement table into skips with this step
      # still green (measured: 33 of 48 cases pass on their own that way).
      # REQUIRED_CASES names the three that may not skip; every other skip is
      # still reported, in a banner saying what it leaves unproven.
      - name: private-egress census and destination-guard agreement (census and agreement table must RUN, not skip)
        run: python analysis/test_private_egress.py

  archive-only-generators:
    # issue #44: these generators used to sit in test_scripts_runnable.py's
    # NEEDS_PRIVATE_ARCHIVE with no CI exercise of their own -- a defect in
    # their main path (not just their leaf functions) could reach main with
    # every check reporting green. Each file below builds its own small,
    # mostly hand-computable synthetic fixture (a flat SAM-8760 pair, a
    # promoted dispatch artifact, a production record shaped from the
    # module's own public rain calendar, ...) and runs the REAL generator
    # end to end against it, so an injected arithmetic defect fails HERE.
    # See test_scripts_runnable.py's VERIFIED_ELSEWHERE_IN_CI for the mapping
    # from NEEDS_PRIVATE_ARCHIVE generator to the CI job that verifies it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: battery backup/arbitrage simulation guard tests
        run: python analysis/test_battery_backup_sims.py
      - name: deep-dive analyses guard tests
        run: python analysis/test_deep_analyses.py
      - name: lifetime solar payback guard tests
        run: python analysis/test_lifetime_payback.py
      - name: panel soiling regression guard tests
        run: python analysis/test_soiling_analysis.py
      - name: extended findings guard tests
        run: python analysis/test_extended_findings.py
      - name: battery x plan matrix guard tests
        run: python analysis/test_battery_plan_matrix.py
      - name: 7-input Monte Carlo uncertainty propagation guard tests
        run: python analysis/test_uncertainty_propagation.py
      - name: gross-import decomposition guard tests
        run: python analysis/test_gross_import_decomposition.py
      - name: reprice-by-vintage guard tests
        run: python analysis/test_reprice_by_vintage.py
      - name: quiet-night-floor guard tests
        run: python analysis/test_quiet_night_floor.py
      # issue #102: real, already-passing local coverage with no CI step of
      # its own -- mostly hand-computable synthetic fixtures (matching this
      # job's own convention), plus a few real-archive cases that gate
      # behind SkipCase and simply skip here.
      - name: heat-pump conversion guard tests
        run: python analysis/test_heat_pump_conversion.py
      # issue #20: same pattern -- synthetic fixtures for every pure
      # function, real-archive cases gated behind SkipCase.
      - name: all-electric endgame guard tests
        run: python analysis/test_all_electric_endgame.py
