name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse-bills:
    # The bill corpus is gitignored, so the corpus-dependent cases skip here. Everything
    # guarding publication — atomic writes, rollback, the recovery-backup rules and the
    # cross-process lock — runs on temp files or the committed data/ artifacts, so a
    # regression in those cannot reach main unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: parse_bills guard tests
        run: python analysis/test_parse_bills.py
      - name: historical rate engine guard tests
        run: python analysis/test_rates_history.py
      - name: bill decomposition guard tests
        run: python analysis/test_bill_decomposition.py
      - name: irreducible-bill guard tests
        run: python analysis/test_irreducible_bill.py

  tou-audit:
    # The TOU audit reconciles billed kWh against the raw interval export, which is
    # gitignored. Every test case is synthetic, so the edge handling that carries the
    # audit — DST-length days, period boundaries, the structural changeover date and
    # holiday assignment — is guarded here in full.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: tou_audit guard tests
        run: python analysis/test_tou_audit.py

  rates:
    # The canonical TOU assignment, including the eight bill-confirmed tariff
    # holidays. These cases are pure logic plus a grep of the analysis package for
    # reintroduced private copies of the window rule, so they need no private data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: rates guard tests
        run: python analysis/test_rates.py
      - name: report/artifact consistency
        run: python analysis/test_report_consistency.py
      - name: TOU-spread escalation guards and artifact regeneration
        run: python analysis/test_tou_spread.py
      - name: NEM 2.0 grandfathering value + battery-marginal reconciliation guard tests
        run: python analysis/test_nem3_grandfathering.py
      - name: DSGS VPP backtest guard tests
        run: python analysis/test_dsgs_vpp_backtest.py
      - name: analysis scripts runnable or explicitly retired
        run: python analysis/test_scripts_runnable.py
      - name: carbon raw-cache and fail-closed branches
        run: python analysis/test_carbon_fullyear.py
      - name: carbon-vs-cost dispatch tradeoff guard tests
        run: python analysis/test_carbon_dispatch_tradeoff.py
      - name: household intake fail-closed behavior
        run: python analysis/test_household.py
      - name: transactional set publication
        run: python analysis/test_publish.py
      - name: service headroom NEC arithmetic and DST guards
        run: python analysis/test_service_headroom.py
      # NOT a real-value scan. private/household.yaml is gitignored, so no
      # runner has a household answer to look for, and putting one here would
      # be the leak the gate exists to prevent. What runs: the resolver
      # contract, the tier vocabulary, the synthetic positive controls, and
      # both halves of the key/path rule for the fields no literal scan can
      # cover. The two cases that need real values SKIP, and the suite prints
      # a banner naming them — read it before treating this check as coverage.
      # The real-value scan runs in the local pre-commit hook (CLAUDE.md §4).
      - name: intake privacy tiers — contract and synthetic controls (real-value scan SKIPS, no private data on a runner)
        run: python analysis/test_privacy_tiers.py
