name: Question or documentation gap
description: Something in the method or docs is unclear, missing, or could be better explained.
title: "[docs] "
labels: ["question"]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no personal data (no names, addresses, account or meter numbers, raw usage rows, or API keys).
          required: true
  - type: input
    id: where
    attributes:
      label: Which document or section?
      placeholder: "e.g. TECHNICAL.md 3.8, GLOSSARY.md, README reproduce step 1"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What is unclear or missing?
      description: Quote the passage if it helps. If you already found the answer elsewhere, say where, so the docs can link it.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement (optional)
    validations:
      required: false
