# household.example.yaml — TEMPLATE for private/household.yaml
# ---------------------------------------------------------------------------
# This committed file contains ONLY generic placeholders. Copy it to
# private/household.yaml and fill in YOUR values by walking the intake
# interview in DATA-SOURCES-CHEATSHEET.md (field ids there map onto the
# keys here). private/ is gitignored: the filled file never leaves your
# machine, and no private-only answer may ever be written into a committed
# artifact. SECRETS (PVOutput API key, monitoring tokens) never belong in
# household.yaml at all — they go ONLY into a gitignored .env file.
#
# Analysis scripts read this through analysis/household.py and FAIL CLOSED
# (SystemExit pointing back at the cheatsheet) if the file or a required
# key is missing — there are no silent defaults for required fields.
# ---------------------------------------------------------------------------

household:
  climate_zone: "Coastal"            # read off the DETAILED BILL — never guessed from ZIP
  utility: "SDG&E"                   # SDG&E / PG&E / SCE / other
  cca: "Example Community Energy"    # generation provider + product; null if utility-bundled
  plan: "EV-TOU-5"                   # current rate plan, from the bill header
  nem_version: "NEM 2.0"             # NEM 1.0 / NEM 2.0 / NBT (Solar Billing Plan)
  pto_date: 2019-01-01               # permission-to-operate date (placeholder)
  has_ev: true                       # cheatsheet has_ev — APPLICABILITY flag, consumed by
                                     # the scripts: true requires the EV fields below
                                     # (charger, misc.miles_per_year, ...); false marks the
                                     # EV analyses not-applicable. Absence of data is NOT
                                     # read as "no EV" — this flag is the authority.
  has_gas: true                      # cheatsheet has_gas — same contract for gas service:
                                     # true requires gas.* and the gas bill corpus; false
                                     # marks gas analyses not-applicable and retires the
                                     # gas artifacts explicitly.
  has_new_load_interest: true        # cheatsheet has_new_load_interest — same contract for
                                     # the service-headroom question (heat pump, second EV
                                     # charger, battery): true requires the panel block
                                     # below; false marks the headroom analysis
                                     # not-applicable. A bill-only analysis sets it false.

location:
  lat: 33.00                         # site latitude, decimal degrees — 2 decimals (~1 km)
                                     # is plenty; drives the soiling study's clear-sky
                                     # model only. Coordinates are PII (CLAUDE.md §4):
                                     # they exist ONLY here in private/, never committed.

solar:                               # omit only if you have no solar (has_solar: false)
  kw_dc: 7.50                        # nameplate DC size (registered with the utility)
  module_count: 20                   # modules x watts should equal kw_dc — verify
  inverter_model: "Example IQ Micro" # microinverter or string-inverter model
  inverter_count: 20
  kw_ac: 6.00                        # AC ceiling: inverter count x rating
  install_invoice_usd: 30000         # total installed price (private-only in the real file)
  install_paid_date: 2019-01         # month the invoice was paid
  itc_claimed: null                  # true / false / null; null = not determined — the
                                     # payback script reports BOTH crossovers (gross and
                                     # net-of-ITC) as scenarios, so null is fine

vehicles:                            # one entry per EV; [] if none (has_ev: false)
  - make_model: "Example EV Long Range"
    in_service_date: 2021-01-01
    odometer: 99999                  # public-ok tier; real value lives in private/household.yaml
  - make_model: "Example EV Compact"
    in_service_date: 2022-01-01
    odometer: 88888

charger:                             # omit the whole block if you have no EV
                                     # (has_ev: false) — nothing reads it then
  kw: 11.5                           # home EV charger max power — the behavior model's
                                     # destination cap when it re-places shifted charging,
                                     # and the existing-EVSE fact service_headroom.py
                                     # publishes. Required only where has_ev is not
                                     # false: with no EV the second-charger scenarios are
                                     # reported not applicable and this key is not read.

panel:                               # omit only if you don't want a service-headroom
                                     # answer (has_new_load_interest: false). Every value
                                     # here is READ OFF THE EQUIPMENT, never inferred from
                                     # the house's age or the meter: the main breaker's
                                     # handle stamp and catalog number, the rating label
                                     # inside the door, the meter face, and the schedule
                                     # card on the inside of the door. Photograph the
                                     # labels; nothing here needs the dead front off, and
                                     # opening the panel is an electrician's job.
                                     #
                                     # TIERS ARE PER FIELD HERE, not per block. Each line
                                     # is tagged [public-ok] or [private-only] to match
                                     # its cheatsheet privacy tier. The bare RATINGS are
                                     # public-ok — an ampere, kA or slot count comes from
                                     # a short list of standard values millions of
                                     # dwellings share, and the published headroom and
                                     # NEC 705.12(B)(3)(2) verdicts cannot be audited
                                     # without them. The IDENTIFYING detail is
                                     # private-only — catalog numbers, the enclosure
                                     # description, the meter class, the breaker family
                                     # and the whole schedule, which names what the
                                     # inside of one particular house runs. A
                                     # [private-only] value must never reach a committed
                                     # artifact; data/service_headroom.json publishes
                                     # only aggregates over the schedule, and
                                     # analysis/test_service_headroom.py fails if any
                                     # private-only value turns up in it.
  service_rating_a: 100              # [public-ok] main breaker rating — the number
                                     # stamped on the main's handle. NOT the bus rating
                                     # below, and not the meter class; a derated main is
                                     # common.
  main_breaker_catalog: "EX-M2100"   # [private-only] catalog/style number printed on the
                                     # main breaker — it names one device, not a rating
  busbar_rating_a: 125               # [public-ok] bus rating off the panel's own rating
                                     # label ("___ AMPS MAX"); often higher than the main
  enclosure_catalog: "EX-LC1224"     # [private-only] load-center catalog number on the
                                     # rating label
  spaces: 12                         # [public-ok] physical breaker spaces (count them)
  max_circuits: 24                   # [public-ok] ceiling with CTL tandems — on the label
  enclosure_type: "NEMA 1 indoor, main-breaker load center"
                                     # [private-only] NEMA type + indoor/outdoor; say so
                                     # if it is a meter-main combination. Free text about
                                     # where on the building the gear sits.
  meter_socket_continuous_a: null    # [public-ok] continuous rating printed on a
                                     # meter-main combination — usually the TIGHTEST
                                     # ampacity limit. Set it to null if you looked and
                                     # the meter socket is a separate enclosure with no
                                     # rating printed. Leave the key out if you have
                                     # not looked; the headroom is then published as
                                     # an upper limit rather than as though the
                                     # constraint did not exist.
  assembly_sccr_ka: 10               # [public-ok] short-circuit current rating of the
                                     # ASSEMBLY, off the rating label — it can differ
                                     # from the rating marked on the main breaker alone
  meter_class: "CL100"               # [private-only] socket class off the meter face —
                                     # a socket rating, NOT the service rating. Read off
                                     # the utility's installed meter, so it stays in
                                     # private/ with the rest of the meter's markings.
  pv_backfeed_a: 30                  # [public-ok] rating of the existing PV (or battery)
                                     # backfeed breaker. Set it to null if you LOOKED and
                                     # nothing backfeeds the panel — that is an answer,
                                     # and the 120% busbar check resolves on it. Leave
                                     # the key out if you have not looked; the check then
                                     # reports not_determined rather than crediting an
                                     # unverified zero.
  breaker_family: "EX / EXC (CTL classified)"
                                     # [private-only] what a new branch breaker has to be
                                     # compatible with — a manufacturer and product line
  main_breaker_position: "top"       # [public-ok] "top" or "bottom" — which end of the
                                     # bus the main lands on. Needed with the field
                                     # below: without both ends the 120% rule's position
                                     # condition reports "not determined".
  pv_breaker_position: "bottom"      # [public-ok] "top" or "bottom" — which end of the
                                     # bus the EXISTING backfeed breaker lands on. NEC
                                     # 705.12(B)(3)(2) wants the opposite end from
                                     # the main.
  battery_breaker_position: null     # [public-ok] "top" or "bottom" — where a NEW
                                     # battery/source breaker would land, if a position
                                     # has been surveyed for one. null until it has. This
                                     # is a separate answer from pv_breaker_position:
                                     # where the existing PV breaker sits says nothing
                                     # about where another 2-pole breaker could go, so it
                                     # is never carried over, and null keeps the
                                     # battery's position condition at "not determined".
  schedule:                          # [private-only] one entry per PHYSICAL device, top
                                     # to bottom. `amps` is a single int, or a list for a
                                     # tandem or quad device (one value per pole group).
                                     # `label` comes from the door legend and is the
                                     # weaker half of each row: the device markings are
                                     # read directly, the legend-to-device mapping is
                                     # inferred from position. The whole list is
                                     # private-only — `device`, `label` and any note name
                                     # the equipment and the circuits of one house — and
                                     # only aggregates over it are ever published.
    - {device: "EX-2P60",  poles: 2, amps: 60, label: "EV charger"}
    - {device: "EX-2P40",  poles: 2, amps: 40, label: "Range"}
    - {device: "EX-T2020 tandem", poles: 2, amps: [20, 20], label: "Kitchen"}
    - {device: "EX-2P30",  poles: 2, amps: 30, label: "Solar PV (backfed)"}

cleaning_history:                    # PAST panel cleanings only (CLAUDE.md §0: events are
                                     # recorded AFTER they happen — never list a scheduled
                                     # or planned cleaning here)
  - date: 2023-01-01
    cost_usd: 150

gas:                                 # omit only if you have no gas service (has_gas: false)
  therm_allin_usd: 2.50              # all-in $/therm computed from ~12 detailed gas bills

misc:
  miles_per_year: 12000              # odometer-derived annualized driven miles, all EVs
  supercharge_kwh_yr: 500            # DC fast-charging kWh/yr (vehicle app charge stats)
